[pytest]
testpaths = tests/unit
addopts = -ra --strict-markers --strict-config
# Derived per consumer by `configs.pull`: emitted only when that project's uv.lock resolves AnyIO,
# dropped otherwise. It cannot ship unconditionally — AnyIO's pytest plugin is what defines this
# key, and `--strict-config` above turns an unrecognised key into `ERROR: Unknown config option`,
# exit 4 with no test executed, rather than a warning. Which consumers have AnyIO is not a property
# anyone chose: it arrives transitively through bump-my-version -> httpx2, so it is present wherever
# repo-tasks is a project dependency and absent where it is a global uv tool.
# See plans/2026-08-29-pytest-ini-anyio-mode.md.
anyio_mode = auto
markers =
    smoke: fast, happy-path integration test — enough to know the system is wired up at all
# An xpass is a failure: a test marked xfail that starts passing means the bug is fixed and the
# marker is stale, which is worth knowing the moment it happens rather than whenever someone reads
# the summary.
xfail_strict = true
# Every warning is an error. This family pins its whole toolchain to pre-1.0 surfaces (uv, ruff,
# invoke), where a DeprecationWarning is the main advance notice that something is about to break —
# and silently-collected warnings are output nobody reads.
#
# Adopted while the baseline was genuinely zero across both tiers, which is what makes it cheap. An
# ignore, when one is eventually needed, belongs right here: this file ships to every consumer via
# configs.pull, and the dependencies behind these warnings are the same everywhere, so a warning
# worth silencing is almost certainly worth silencing family-wide.
filterwarnings =
    error
    # `testpaths` names tests/unit, and a flat-`tests/` repo is a supported layout, not a mistake:
    # pytest's documented behaviour there is to warn and search from the working directory instead,
    # which is exactly the fallback contributing/test-tiers.md relies on rather than hand-rolling.
    # `error` turned that intended fallback into a hard exit-1 crash — measured, a repo with a plain
    # `tests/` could not run pytest at all. The one warning this file must not promote, because this
    # file is what causes it.
    ignore:No files were found in testpaths:pytest.PytestConfigWarning
    # `invoke`'s Local runner never closes the subprocess pipes it opens, so every real `c.run`
    # leaks two or three file objects that surface as ResourceWarnings whenever the garbage
    # collector gets to them — pytest's unraisable-exception plugin then re-raises each one, and
    # under `error` the whole session exits 1 after the last test has already passed. Reproduced
    # with no test code involved at all: `Context().run("true", hide=True)` plus `gc.collect()`
    # under `-W error::ResourceWarning`, on invoke 3.0.3.
    #
    # Family-wide by the same argument as `error` itself: every consumer's integration tier drives
    # real tasks through `c.run`. The cost is that a genuine unclosed file in a consumer's own test
    # or code is silenced along with invoke's; that is accepted because the only tier this reaches
    # is the opt-in one, where nothing asserts on file handles anyway. Drop this once invoke closes
    # them.
    ignore:unclosed file:ResourceWarning
