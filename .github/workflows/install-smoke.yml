name: install.sh smoke test

# Reusable rather than inline, because two workflows need the same answer and a second copy of a
# job is a copy that drifts. `ci.yml` calls it for coverage on every push and pull request;
# `devcontainer.yml` calls it so `publish-stable` can require it before moving the `stable` tag —
# `needs:` does not reach across workflows, so a shared definition is what lets one job gate a
# release step defined somewhere else. A `./` caller always resolves this file at the caller's own
# commit, so both callers test the code they were triggered on.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # install.sh is the line people paste, so its failure is somebody else's first impression of this
  # repo. Its unit tests (tests/unit/test_install_sh.py) cover every branch that happens before a
  # download — adopt, refuse, the no-terminal refusal — against a stub bootstrap.sh. What they
  # deliberately cannot cover is the real one, which fetches uv and a Python, and that is the half
  # that had only ever been checked by hand.
  #
  # It installs *the commit under test*, not what is published: `--repo-url` points at this
  # checkout, and the clone takes a branch created at HEAD. That indirection is what makes the job
  # able to gate a change at all — cloning `stable` from GitHub would test whatever was already
  # released, which is exactly the evidence that is not missing. `git branch` rather than a SHA
  # because `git clone --branch` takes a branch or tag and not an arbitrary commit, and it works
  # from the detached HEAD a pull_request checkout leaves behind.
  smoke:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the local clone below has real history to take. `git clone --depth 1`
      # from a *shallow* repo is the failure this avoids; a full checkout of this repo is cheap.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git branch ci-install-smoke
      - name: Clone and bootstrap through install.sh
        run: |
          bash install.sh \
            --repo-url "${GITHUB_WORKSPACE}" \
            --ref ci-install-smoke \
            --dir "${RUNNER_TEMP}/pulse" \
            --bootstrap-only
      # --bootstrap-only stops before `inv setup`, which the devcontainer smoke test already runs in
      # full. What is asserted here is narrower and is the installer's own promise: that what it
      # leaves behind is a checkout with a working task runner in it. bootstrap.sh exports its PATH
      # into a child process only, so the next step has to be told where `inv` landed.
      - run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - run: inv --list
        working-directory: ${{ runner.temp }}/pulse
