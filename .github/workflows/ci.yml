name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: nothing here writes anything back to the repo, and the default token grant is
# broader than that. persist-credentials: false on each checkout for the same reason — no job here
# pushes, and the default would otherwise leave the token where every later step can read it.
permissions:
  contents: read

jobs:
  # In its own file so devcontainer.yml's publish-stable can require it before moving the `stable`
  # tag — same reason as install-smoke below.
  quality:
    uses: ./.github/workflows/quality.yml

  # The docs build is a check, and it lives here rather than in `quality.check` because it writes
  # `site/` and that gate is the read-only half by construction — `repo_tasks.quality.precommit`'s
  # docstring carries that decision and the argument it beat. What it catches is whatever a renderer
  # objects to, which dprint (never reading markdown as a document) and a reviewer (seeing a path
  # that is genuinely correct) both miss. Two red Pages deploys, on 2a4de19 and ae59318, are what it
  # is here to prevent — those were dangling heading anchors, which `inv docs.link-check` now
  # resolves on its own, so this is defence in depth behind that rather than the sole detector.
  # Background: contributing/zensical.md, "Renaming a heading is an anchor change".
  #
  # A job rather than a step in `quality`, so a docs failure is named "docs" in the runs list
  # instead of reading as a lint failure — the whole problem this addresses is a signal nobody
  # looks at. `--only-group docs` needs no dev sync, so it is cheaper than reusing ci-bootstrap.sh,
  # and it is the same command publish_on_push.yml runs, resolving the same pin from uv.lock.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv run --only-group docs --frozen zensical build --strict

  # Mirrors bootstrap.sh's actual invocation shape for the *default-declined* --invoke-only path
  # (never `uv sync`, never touches this project's own dependency groups) — the invariant this
  # whole job exists to guard is plans/2026-08-20-runtime-dev-venv-split.md's Context: a machine
  # with no repo_tasks available at all still gets a working `inv --list` via
  # tasks/__init__.py's _import_repo_tasks_modules degrading to four Nones, rather than an import
  # error taking down every other `inv` command. `quality` above already covers the
  # everything-available case (a real `uv sync`), so this job deliberately installs bare `invoke`
  # instead of `repo-tasks`.
  runtime-guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv tool install --force invoke
      - run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - run: inv --list
      - run: PULSE_DRY_RUN=1 inv apt.install-repos apt.install-base apt.install-debs tools.install fonts.install

  # Defined in its own file because devcontainer.yml's publish-stable also needs it before it moves
  # the `stable` tag, and `needs:` does not reach across workflows. This call is what gives it
  # coverage on every push and pull request; that one is what makes it a release gate.
  install-smoke:
    uses: ./.github/workflows/install-smoke.yml

  # The zero-install entrypoint, on the interpreter it will actually meet: Ubuntu 24.04's system
  # python3 is 3.12, and this repo targets 24.04. A unit test already asserts the module parses at
  # that version and imports nothing outside the standard library, but "parses" is not "runs" —
  # this is the only thing that proves the diagnostic a blocked machine is told to run works
  # there, with no uv, no invoke and no venv in sight.
  netdoctor-python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # --advisory: a blocked endpoint on a GitHub runner is a fact about the runner's network,
      # not a defect in this repo. The job is asserting that it runs and produces a report.
      - run: python3 tasks/netdoctor.py --quick --advisory
      - run: python3 tasks/netdoctor.py --quick --advisory --json
