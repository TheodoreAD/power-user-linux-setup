name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: nothing here writes anything back to the repo, and the default token grant is
# broader than that. persist-credentials: false on each checkout for the same reason — neither job
# pushes, and the default leaves the token in .git/config for every later step to read.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - run: ./.github/ci-bootstrap.sh
      - run: inv quality.check

  # Mirrors bootstrap.sh's actual invocation shape for the *default-declined* --invoke-only path
  # (never `uv sync`, never touches this project's own dependency groups) — the invariant this
  # whole job exists to guard is plans/2026-08-20-runtime-dev-venv-split.md's Context: a machine
  # with no repo_tasks available at all still gets a working `inv --list` via
  # tasks/__init__.py's _import_repo_tasks_modules degrading to four Nones, rather than an import
  # error taking down every other `inv` command. `quality` above already covers the
  # everything-available case (a real `uv sync`), so this job deliberately installs bare `invoke`
  # instead of `repo-tasks`.
  runtime-guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv tool install --force invoke
      - run: echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
      - run: inv --list
      - run: PULSE_DRY_RUN=1 inv apt.install-repos apt.install-base apt.install-debs tools.install fonts.install

  # The zero-install entrypoint, on the interpreter it will actually meet: Ubuntu 24.04's system
  # python3 is 3.12, and this repo targets 24.04. A unit test already asserts the module parses at
  # that version and imports nothing outside the standard library, but "parses" is not "runs" —
  # this is the only thing that proves the diagnostic a blocked machine is told to run works
  # there, with no uv, no invoke and no venv in sight.
  netdoctor-python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # --advisory: a blocked endpoint on a GitHub runner is a fact about the runner's network,
      # not a defect in this repo. The job is asserting that it runs and produces a report.
      - run: python3 tasks/netdoctor.py --quick --advisory
      - run: python3 tasks/netdoctor.py --quick --advisory --json
