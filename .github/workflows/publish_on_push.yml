# https://zensical.org/

name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Scoped to the one job that needs it: actions-gh-pages pushes the built site to gh-pages.
    permissions:
      contents: write
    steps:
      # persist-credentials: false is safe even though this job publishes — actions-gh-pages pushes
      # with the token handed to it below, never with the credentials the checkout would leave in
      # .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
      # The pin comes from pyproject.toml's `docs` dependency group via uv.lock, the same one
      # `inv docs.build` resolves locally — a requirements-docs.txt read only here is what let the
      # two drift and fail a deploy that passed locally. `--only-group` skips dev entirely (this
      # job needs zensical, not basedpyright), and `--frozen` makes a stale lock an error rather
      # than a silent re-resolve to some other version.
      - run: uv run --only-group docs --frozen zensical build --strict
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
