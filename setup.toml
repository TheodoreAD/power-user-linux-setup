[packages.google-chrome-x11]
description = """
Force Chrome (and its installed PWA windows) onto XWayland via a user-level google-chrome.desktop
override — works around an NVIDIA-driver + native-Wayland bug where protected/DRM video (e.g.
Netflix) renders as a black overlay while audio keeps playing. Google Chrome's official .deb
wrapper does NOT read a chrome-flags.conf file (that's a Chromium-package convention only), so the
flag has to go on the launcher's Exec line instead. This user-level file in
~/.local/share/applications takes XDG priority over the system one, so dock/app-grid/taskbar
launches inherit the flag too.
Machine-specific workaround, not a universal default — enable only if you hit this NVIDIA+Wayland
black-video symptom (audio fine, video black except a flash on play/pause).
"""
method = "wrapper-script"
enabled = false
tags = ["browser", "desktop", "gui"]
dest = "~/.local/share/applications/google-chrome.desktop"
content_file = "config/google-chrome-x11.desktop"

