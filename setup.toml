[packages.research-library]
description = """
Shared, cross-project research library at ~/research — vendor repo clones, PDFs/epubs, and
mirrored docs pages that live outside every git repo, so they're readable and updatable from
any project without duplicating clones per-repo or exposing them to repo-scoped agent reads by
default. Deploys the RESEARCH_HOME env var and a research-update script that refreshes every
shallow clone under $RESEARCH_HOME/repos/.
"""
method = "wrapper-script"
tags = ["dev"]
dest = "~/.local/bin/research-update"
content_file = "config/research-update.sh"
zshenv = 'export RESEARCH_HOME="${HOME}/research"'
skills = [{ source = "local", path = "skills/research-library" }]
# Grants Read/Glob/Grep on the whole library without a per-call prompt — this is curated,
# read-only reference material, not arbitrary internet content, so treating it like project files
# rather than gating every lookup is the point of building this in the first place. Applied
# declaratively by `inv ai.skills` (tasks/ai.py), tracked via its own manifest — deliberately
# separate from tasks/allowlist.py's CLI-classification pipeline, which this isn't part of; see
# docs/claude-code.md.
claude_permissions_allow = [
  "Glob(//home/tdumitrescu/research/**)",
  "Grep(//home/tdumitrescu/research/**)",
  "Read(//home/tdumitrescu/research/**)",
]

