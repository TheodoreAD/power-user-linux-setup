[packages.fzf]
description = "Interactive fuzzy finder — Ctrl+R history, Ctrl+T file picker, Alt+C directory jump, ** tab completion. Uses fd for file listing and bat for previews."
method      = "apt"
tags        = ["search", "interactive"]
zshenv      = """
# Use fd as the default source: respects .gitignore, includes hidden files, skips .git
export FZF_DEFAULT_COMMAND='fd --type f --hidden --follow --exclude .git'
export FZF_CTRL_T_COMMAND="${FZF_DEFAULT_COMMAND}"
export FZF_ALT_C_COMMAND='fd --type d --hidden --follow --exclude .git'
# Global UI defaults
export FZF_DEFAULT_OPTS='--height=40% --layout=reverse --border=rounded --info=inline'
# Ctrl+T: preview file contents with bat
export FZF_CTRL_T_OPTS="--preview 'bat -n --color=always --line-range :300 {}'"
# Alt+C: preview directory listing
export FZF_ALT_C_OPTS="--preview 'ls -la {}'"
# Ctrl+R: show full command in a toggleable preview (Ctrl+/ to toggle)
export FZF_CTRL_R_OPTS="--preview 'echo {}' --preview-window=up:3:hidden:wrap --bind 'ctrl-/:toggle-preview'"
"""
zshrc       = """
[ -f /usr/share/doc/fzf/examples/key-bindings.zsh ] && source /usr/share/doc/fzf/examples/key-bindings.zsh
[ -f /usr/share/doc/fzf/examples/completion.zsh ] && source /usr/share/doc/fzf/examples/completion.zsh
"""

[packages.atuin]
description = "Shell history replacement — SQLite backend, rich search UI (exit code, directory, duration per command). No sync, no daemon. Disabled pending evaluation; fzf handles Ctrl+R for now."
method      = "archive"
enabled     = false
tags        = ["shell", "search", "interactive"]
check_cmd   = "atuin"
version_cmd = "curl -fsSL https://api.github.com/repos/atuinsh/atuin/releases/latest | python3 -c \"import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))\""
download_url = "https://github.com/atuinsh/atuin/releases/download/v{version}/atuin-x86_64-unknown-linux-gnu.tar.gz"
bin_pick    = "atuin"
bin_in_root = true
zshrc       = """
# Atuin takes over Ctrl+R. --disable-up-arrow keeps the Up arrow as normal chronological history.
# No daemon and no sync are needed for local-only use — just don't run 'atuin login'.
# When enabling: also remove fzf's key-bindings.zsh source from [packages.fzf] to avoid
# the Ctrl+R conflict (keep completion.zsh for Ctrl+T, Alt+C, and ** tab completion).
eval "$(atuin init zsh --disable-up-arrow)"
"""

[packages.fkill]
description = "Interactive fuzzy process killer — fkill to pick from a list, fkill :PORT to kill by port. Requires fzf."
method      = "zsh"
tags        = ["cli", "interactive"]
zshrc       = """
fkill() {
  if [[ "$1" == :* ]]; then
    lsof -ti "${1#:}" | xargs kill
  else
    ps aux | fzf --multi --header-lines=1 | awk '{print $2}' | xargs kill
  fi
}
"""

[packages.askpass-zenity]
description = "Zenity GUI askpass helper — enables sudo and ssh-agent key unlocks without a terminal by showing a GUI password/passphrase dialog"
method      = "wrapper-script"
tags        = ["shell", "system"]
dest        = "~/.local/bin/askpass-zenity"
content     = """
#!/bin/bash
# $1 is the caller-supplied prompt (sudo passes "[sudo] password for user:", ssh passes
# "Enter passphrase for key '...':") — shown verbatim so the dialog is accurate for either caller.
zenity --password --title="Authentication required" --text="${1:-Password required}"
"""
zshenv      = """
export SUDO_ASKPASS="${HOME}/.local/bin/askpass-zenity"
export SSH_ASKPASS="${HOME}/.local/bin/askpass-zenity"
export SSH_ASKPASS_REQUIRE="prefer"
"""

[packages.claude-global-md]
description = "Global ~/.claude/CLAUDE.md — sudo and git/ssh instructions for all Claude Code sessions"
method      = "wrapper-script"
tags        = ["shell", "ai"]
dest        = "~/.claude/CLAUDE.md"
content     = """
# Claude Code — global instructions

## sudo

Always use `sudo -A` (not plain `sudo`). The `SUDO_ASKPASS` environment variable points to
`~/.local/bin/askpass-zenity`, which opens a Zenity GUI dialog for the password. Plain `sudo`
fails because there is no TTY attached to the Bash tool.

```shell
# correct
sudo -A apt install -y something
sudo -A cp /tmp/foo /etc/bar

# wrong — hangs or fails with "sudo: a terminal is required"
sudo apt install -y something
```

## git fetch/push over SSH

`SSH_ASKPASS` (same `askpass-zenity` helper) and `SSH_ASKPASS_REQUIRE=prefer` are set, so a
`git fetch`/`git push` that needs to unlock an SSH key (no key loaded yet in the `keychain`-managed
agent this session) pops the same GUI passphrase dialog instead of failing with "Permission
denied (publickey)". `prefer` only engages the dialog when there's no usable TTY — your own
interactive terminal is unaffected and still prompts normally. Just run the `git` command as
normal; no HTTPS/token workaround needed. The dialog blocks on user input, so if nobody is at the
machine to enter the passphrase it will time out rather than hang forever.
"""

