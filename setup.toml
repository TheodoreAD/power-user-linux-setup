check_cmd = "atuin"
version_cmd = "curl -fsSL https://api.github.com/repos/atuinsh/atuin/releases/latest | python3 -c \"import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))\""
download_url = "https://github.com/atuinsh/atuin/releases/download/v{version}/atuin-x86_64-unknown-linux-gnu.tar.gz"
bin_pick = "atuin"
bin_in_root = true
zshrc = """
# Atuin takes over Ctrl+R. --disable-up-arrow keeps the Up arrow as normal chronological history.
# No daemon and no sync are needed for local-only use — just don't run 'atuin login'.
# When enabling: also remove fzf's key-bindings.zsh source from [packages.fzf] to avoid
# the Ctrl+R conflict (keep completion.zsh for Ctrl+T, Alt+C, and ** tab completion).
eval "$(atuin init zsh --disable-up-arrow)"
"""

[packages.fkill]
description = "Interactive fuzzy process killer — fkill to pick from a list, fkill :PORT to kill by port. Requires fzf."
method = "zsh"
tags = ["cli", "interactive"]
zshrc = """
fkill() {
  if [[ "$1" == :* ]]; then
    lsof -ti "${1#:}" | xargs kill
  else
    ps aux | fzf --multi --header-lines=1 | awk '{print $2}' | xargs kill
  fi
}
"""

