[packages.apparmor-jbr-cef]
description = """
AppArmor profiles for JetBrains IDEs — grants user namespace access so the embedded
Chromium browser (JCEF) can run sandboxed. Required on Ubuntu 24.04 where
kernel.apparmor_restrict_unprivileged_userns = 1 by default. Without this, PyCharm and
other JetBrains IDEs show: "The system restricts the embedded browser from running with
the sandbox enabled." Two profiles are needed: one for the IDE binary itself, one for
the cef_server subprocess it spawns.
"""
method = "apparmor-profile"
tags = ["system", "ide", "gui"]
profile = "/etc/apparmor.d/jbr-cef"
content = """
abi <abi/4.0>,
include <tunables/global>

# IDE binary — unconfined profile: only adds userns, does not restrict anything else
profile jbr_pycharm /home/*/.local/share/JetBrains/Toolbox/apps/pycharm/bin/pycharm flags=(unconfined) {
  userns,
  include if exists <local/chrome>
}

# cef_server subprocess — spawned by the IDE to run the embedded Chromium browser
profile jbr_cef /home/*/.local/share/JetBrains/Toolbox/apps/*/jbr/lib/cef_server {
  userns,
  include if exists <local/chrome>
}
"""

