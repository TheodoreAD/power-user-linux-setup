[packages.apparmor-jbr-cef]
description = """
AppArmor profiles for JetBrains IDEs — grants user namespace access so the embedded
Chromium browser (JCEF) can run sandboxed. Required on Ubuntu 24.04 where
kernel.apparmor_restrict_unprivileged_userns = 1 by default. Without this, PyCharm and
other JetBrains IDEs show: "The system restricts the embedded browser from running with
the sandbox enabled." Two profiles are needed: one for the IDE binary itself, one for
the cef_server subprocess it spawns.
"""
method  = "apparmor-profile"
tags    = ["system", "ide", "gui"]
profile = "/etc/apparmor.d/jbr-cef"
content = """
abi <abi/4.0>,
include <tunables/global>

# IDE binary — unconfined profile: only adds userns, does not restrict anything else
profile jbr_pycharm /home/*/.local/share/JetBrains/Toolbox/apps/pycharm/bin/pycharm flags=(unconfined) {
  userns,
  include if exists <local/chrome>
}

# cef_server subprocess — spawned by the IDE to run the embedded Chromium browser
profile jbr_cef /home/*/.local/share/JetBrains/Toolbox/apps/*/jbr/lib/cef_server {
  userns,
  include if exists <local/chrome>
}
"""

[packages.webex]
description = "Cisco Webex video conferencing and messaging"
method      = "deb-url"
tags        = ["gui", "corporate"]
enabled     = false
check_cmd   = "webex"
url         = "https://binaries.webex.com/WebexDesktop-Ubuntu-Official-Package/Webex.deb"

[packages.citrix-workspace-deps]
description = "Runtime dependency for Citrix Workspace — provides libwoff2dec.so required by selfservice"
method      = "apt"
tags        = ["gui", "corporate"]
packages    = ["libwoff1"]

[packages.citrix-workspace]
description   = "Citrix Workspace — remote desktop and app access"
method        = "deb-url"
tags          = ["gui", "corporate"]
enabled       = false
check_cmd     = "selfservice"
packages      = ["icaclient"]
download_page = "https://www.citrix.com/downloads/workspace-app/linux/"
cleanup_paths = ["/etc/dconf/db/local.d/locks/extensions-mandatory"]

# nsgclient/nsepa: not usable — the gateway doesn't include a session token in the
# nsgcepa:// EPA callback for Linux clients, so login always fails. See docs/citrix.md.
# Abandoned; kept disabled and tracked here only so `inv apt.uninstall` can purge leftovers
# if any of this gets reinstalled for testing later.
[packages.citrix-secure-access]
description   = "Citrix Secure Access — corporate VPN client for Citrix Gateway (nsgclient)"
method        = "deb-url"
tags          = ["gui", "corporate"]
enabled       = false
check_cmd     = "NSGClient"
packages      = ["nsgclient"]
download_page = "https://www.citrix.com/downloads/citrix-secure-access/plug-ins/Citrix-Gateway-VPN-EPA-Clients-Ubuntu.html"
cleanup_paths = [
    "/opt/Citrix",
    "/var/log/citrix",
    "/etc/NetworkManager/conf.d/citrix_va.conf",
    "/usr/share/applications/nsgclient.desktop",
    "/usr/local/bin/NSGClient",
    "/usr/local/bin/nsgcepa",
    "~/.citrix",
]

[packages.citrix-epa]
description   = "Citrix Endpoint Analysis — device posture checks required by Citrix Secure Access (nsepa)"
method        = "deb-url"
tags          = ["gui", "corporate"]
enabled       = false
packages      = ["nsepa"]
download_page = "https://www.citrix.com/downloads/citrix-endpoint-analysis/plug-ins/EPA-Clients-Linux.html"
cleanup_paths = ["/usr/share/applications/nsgcepa.desktop"]

[packages.hyperfine]
description = "Command-line benchmarking tool with statistical analysis and warmup runs"
method      = "deb-github"
tags        = ["dev", "benchmark", "cli"]
repo        = "sharkdp/hyperfine"
asset       = "hyperfine_{version}_amd64.deb"
check_cmd   = "hyperfine"

[packages.dive]
description = "Docker image layer inspector — visualise layer contents and size"
method      = "deb-github"
repo        = "wagoodman/dive"
asset       = "dive_{version}_linux_amd64.deb"
check_cmd   = "dive"

[packages.go]
description  = "Go programming language runtime — installs to ~/.local/share/go"
method       = "archive"
tags         = ["dev", "language"]
check_cmd    = "go"
version_url  = "https://go.dev/VERSION?m=text"
download_url = "https://go.dev/dl/{version}.linux-amd64.tar.gz"
extract_to   = "~/.local/share"
install_dir  = "~/.local/share/go"
zshenv       = """
export GOROOT="${HOME}/.local/share/go"
export GOPATH="${HOME}/go"
export PATH="${PATH}:${GOROOT}/bin:${GOPATH}/bin"
"""

[packages.nox]
description = "Python session-based test automation, similar to tox"
method      = "uv-tool"
package     = "nox"

[packages.mkdocs-material]
description = "Documentation site generator with Material Design theme and Mermaid diagram support"
method      = "uv-tool"
package     = "mkdocs"
check_cmd   = "mkdocs"
extras      = ["mkdocs-material"]

[packages.twine]
description = "Utility for publishing Python packages to PyPI"
method      = "uv-tool"
package     = "twine"

[packages.nuitka]
description = "Python-to-C compiler — compiles Python scripts into standalone native executables"
method      = "uv-tool"
package     = "nuitka"

[packages.glances]
description = "Cross-platform system monitoring TUI — CPU, memory, disk, network at a glance"
method      = "uv-tool"
package     = "glances"

[packages.zensical]
description = "Modern static site generator from the creators of Material for MkDocs — Rust core, Python API"
method      = "uv-tool"
package     = "zensical"

[packages.uv-env]
description = "UV_PYTHON shell default and completions — keep UV_PYTHON in sync with settings.uv_python_default"
method      = "zsh"
zshenv      = 'export UV_PYTHON="3.11"'
zshrc       = """
eval "$(uv generate-shell-completion zsh)"
eval "$(uvx --generate-shell-completion zsh)"
"""

[packages.dprint]
description   = "Fast pluggable code formatter for JSON, TOML, Markdown and YAML"
method        = "script"
script_url    = "https://dprint.dev/install.sh"
check_cmd     = "dprint"
single_binary = true
# Plugins to add when initialising a project: dprint config add json toml markdown yaml dockerfile
plugins       = ["json", "toml", "markdown", "yaml", "dockerfile"]

[packages.dprint.env]
DPRINT_INSTALL = "~/.local"

[packages.node]
description     = "Node.js LTS via nvm — installs to ~/.local/share/nvm"
method          = "nvm"
omz_plugin      = "nvm"
version         = "lts"
nvm_dir         = "~/.local/share/nvm"
global_packages = ["skills"]  # npx skills add <owner>/<repo> — installs Claude Code slash commands from GitHub
zshenv          = 'export NVM_DIR="${HOME}/.local/share/nvm"'
zshrc           = 'export NVM_DIR="${HOME}/.local/share/nvm"'

[packages.rust]
description = """
Rust toolchain via rustup — installs rustc, cargo, rustfmt, and clippy (the default rustup
profile), plus the rust-analyzer component, to ~/.local/share/cargo and
~/.local/share/rustup, instead of the ~/.cargo / ~/.rustup dotdirs rustup creates by default.
rust-analyzer is only needed for non-JetBrains editors (VS Code, Neovim, etc.) — PyCharm's
Rust plugin uses its own analysis engine, see docs/ide.md.
"""
method       = "script"
tags         = ["dev", "language"]
script_url   = "https://sh.rustup.rs"
shell        = "sh -s -- -y --no-modify-path --profile default"
check_path   = "~/.local/share/cargo/bin/rustc"
post_install = "~/.local/share/cargo/bin/rustup component add rust-analyzer"
zshenv       = """
export RUSTUP_HOME="${HOME}/.local/share/rustup"
export CARGO_HOME="${HOME}/.local/share/cargo"
[ -f "${CARGO_HOME}/env" ] && . "${CARGO_HOME}/env"
"""

[packages.rust.env]
RUSTUP_HOME = "~/.local/share/rustup"
CARGO_HOME  = "~/.local/share/cargo"
