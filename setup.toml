# Machine setup configuration.
# Each [packages.*] section declares one installable unit and how to install it.
# Supported methods: apt, apt-repo, deb-github, deb-url, archive, uv-tool, nvm, script, binary,
#                     git-clone, wrapper-script, gnome-extension, apparmor-profile, zsh
#
# Common fields (all methods):
#   description   human-readable summary of what the package is/does
#   enabled       set to false to skip without deleting the section (default: true)
#   tags          list of category labels (e.g. ["terminal", "search", "modern"])
#                 use "gui" to mark packages that require a display server (excluded on headless/SSH installs)
#
# Tag-based exclusion:
#   Set PULSE_EXCLUDE_TAGS=<tag> or PULSE_EXCLUDE_TAGS=<tag1>,<tag2> to skip packages with matching tags.
#   Example: PULSE_EXCLUDE_TAGS=gui inv apt.repos   — skips all GUI packages on a headless server.
#   Only respected by util.packages_by_method() — the generic per-method install tasks (apt,
#   apt-repo, deb-github, deb-url, archive, uv-tool, script, binary, git-clone, wrapper-script,
#   gnome-extension, apparmor-profile). A few core tasks read one [packages.*] section directly and
#   ignore tags/enabled entirely (node.install, docker.configure, fonts.*) or check enabled but not
#   tags (zsh.configure's zshrc/zshenv/zprofile block writer) — see docs/index.md, "Tags, enabled,
#   and which tasks actually respect either" for the full breakdown before building a new profile.
#
# Tags that actually gate an exclusion recipe (everything else is organizational only):
#   gui         — requires a display server (Wayland/X11); skip on headless machines and in containers
#   desktop     — depends on a desktop session (e.g. Wayland clipboard); usually paired with gui
#   gnome       — GNOME Shell extensions / gnome-extensions-cli; meaningless without GNOME Shell
#   corporate   — work-specific tools (Webex, Citrix); skip on personal machines
#   workstation — physical machine only (hardware sensors, local terminal multiplexer, Docker); skip in containers
#
# For dev container / Dockerfile builds, exclude: PULSE_EXCLUDE_TAGS=gui,workstation,corporate
# See docs/dev-container.md for the full Dockerfile approach and which invoke tasks to skip.
#
# For WSL, exclude: PULSE_EXCLUDE_TAGS=gui,desktop,gnome,workstation,corporate
# Run `inv wsl.check` first — diagnoses systemd, DNS, Docker, and WSLg risks before you install
# anything. See docs/wsl.md for the full picture.
#
# apt / apt-repo sections:
#   packages      list of apt package names to install (optional — defaults to [section-name])
#                 only needed when the apt name differs from the section name, or for multi-package groups
#                 also read by `inv apt.uninstall <section-name>` for any method, to map the section
#                 to the actual dpkg package name(s) to purge
#
# deb-github sections:
#   repo          "owner/repo" — GitHub repo whose releases host the .deb
#   tag           literal release tag to install (e.g. "v14.0.0"); omit to auto-resolve the latest
#                 release via the GitHub API each run (used by inv apt.upgrade-debs)
#   tag_prefix    prefix before the version in the release URL path (default: "v"; set to "" if the
#                 tag itself already includes "v", e.g. tag = "v14.0.0" with tag_prefix = "")
#   asset         release asset filename; supports {version} templating (version = tag, minus any
#                 leading "v" the resolver strips). If the asset is a .zip (some CI artifacts wrap
#                 the .deb), it's unzipped to a scratch dir and whatever .deb is inside is installed.
#   check_cmd     binary name to check for already-installed (default: section name)
#
# deb-url sections:
#   url           direct .deb URL. Supports {version} + version_cmd for dynamic resolution — set
#                 version_cmd to a shell command that prints the version string on stdout (see
#                 [packages.glab] for a GitLab-releases-API example, since GitLab projects aren't on
#                 GitHub and deb-github doesn't apply to them)
#   download_page fallback when there's no stable/scriptable download URL (e.g. Citrix) — prints the
#                 page and prompts interactively for a local path to a manually downloaded .deb
#   check_cmd     binary name to check for already-installed (default: section name)
#   Only one of url / download_page is needed; url takes priority if both are set.
#
# binary sections:
#   url           direct URL to download as an executable into ~/.local/bin/<check_cmd>
#   check_cmd     binary name to check/install as (default: section name)
#
# archive sections:
#   download_url  URL to a .tar.gz archive; supports {version} + version_cmd exactly like deb-url
#                 above (see [packages.atuin]), or {version} + version_url (fetch latest version
#                 string via `curl | head -1` instead of a custom command)
#   extract_to    directory to extract into (creates <name> subdirectory)
#   install_dir   expected post-extract path; removed and re-extracted if missing
#   strip_components  path components to strip on extract (default: 1 with bin_pick, 0 with install_dir)
#   bin_pick      if set, extract only this binary name to ~/.local/bin/ (strips top-level dir unless
#                 bin_in_root = true, for archives with the binary directly at the archive root)
#   symlinks      list of {src, dst} — additional symlinks into ~/.local/bin after extraction
#                 (dst relative to install_dir)
#   check_path    path to check for existence instead of check_cmd (useful when binary is not on PATH yet)
#
# uv-tool sections:
#   package       PyPI package name to install (uv tool install --upgrade <package>)
#   python        override the Python version for this tool (default: settings.uv_python_default)
#   extras        list of extra packages to install alongside (--with <extra>, e.g. python-dotenv)
#   check_cmd     binary name to check/install as (default: section name)
#
# script sections:
#   script_url    URL piped into a shell (curl -fsSL <script_url> | <shell>) — for installers that
#                 only ship as a shell script (nvm-style; but see the nvm note below — node itself
#                 is NOT a generic script-method entry, it's a dedicated task)
#   shell         interpreter for the piped script (default: "sh")
#   env           dict of env vars passed to the install script; values starting with "~" are
#                 expanded to the home directory first
#   single_binary / symlink_from   if the installer doesn't already put its binary on PATH,
#                 symlink_from names the installed path to symlink into ~/.local/bin/<check_cmd>
#   post_install  optional shell command run once, right after the install script succeeds
#                 (same env dict as above; only runs on first install, not on later re-runs —
#                 the whole section is skipped once check_cmd/check_path already exists)
#   check_cmd / check_path   same as other methods
#
# git-clone sections:
#   repo          URL to git clone
#   dest          destination path (existence alone is the "already installed" check — no update logic)
#   depth         optional shallow-clone depth (e.g. 1)
#
# wrapper-script sections:
#   dest          path to write an executable script to (chmod 0o755)
#   content       the script body, written verbatim (stripped + trailing newline added)
#   Rewritten in place whenever content changes — treat dest as fully PULSE-owned, not user-editable.
#
# gnome-extension sections:
#   uuid          extension UUID (e.g. "dash-to-panel@jderose9.github.com") — shown in gnome-extensions list
#   ego_id        numeric EGO package ID from extensions.gnome.org — fallback when UUID is not yet confirmed
#   gext accepts both. Managed by: inv gnome.extensions
#   Requires a live GNOME session; newly installed extensions activate after logout/login.
#
# apparmor-profile sections:
#   profile       absolute path to write the profile to (e.g. /etc/apparmor.d/jbr-cef)
#   content       the profile body, written verbatim. Reloaded via apparmor_parser -r after writing.
#
# nvm / Node.js — NOT a generic dispatched method, despite being listed above:
#   [packages.node] is read directly by node.install (tasks/node.py), not via packages_by_method().
#   enabled and tags on this section are NOT checked — inv node.install always runs if invoked.
#   Fields: version (default "lts"), global_packages (list of npm -g package names), nvm_dir
#   (default ~/.local/share/nvm).
#
# any section (any method):
#   zshrc         shell snippet appended to ~/.zshrc   (interactive shells — hooks, completions)
#   zshenv        shell snippet appended to ~/.zshenv  (all shells — environment variables)
#   zprofile      shell snippet appended to ~/.zprofile (login shells)
#   Snippets are wrapped in named sentinel comments and are idempotent across runs.
#   Use method = "zsh" for config-only entries with no associated package to install.

[settings]
# Default Python for all uv tool installs — uv downloads it if not already managed.
# Read by bootstrap.sh via grep; keep the value on the same line as the key.
# Override per-package with a python field in the [packages.X] section.
uv_python_default = "3.11"
# Additional Python versions for uv to install and manage (e.g. for project virtualenvs).
# Read by bootstrap.sh; each version is installed but not set as default.
uv_python_extra   = ["3.12", "3.13", "3.14"]

# ---------------------------------------------------------------------------
# Font configuration — read by inv fonts.install and inv fonts.configure.
# ---------------------------------------------------------------------------

[settings.fonts]
# Font set as org.gnome.desktop.interface monospace-font-name (covers all GTK apps).
monospace = "CaskaydiaCove Nerd Font Mono 12"
# Font set on the GNOME Terminal default profile.
terminal  = "CaskaydiaCove Nerd Font Mono 12"

# Keys merged into VS Code settings.json. Quoted keys preserve dots (TOML quoted-key syntax).
[settings.fonts.vscode]
"editor.fontFamily"              = "'CaskaydiaCove Nerd Font', monospace"
"editor.fontSize"                = 12
"editor.fontLigatures"           = true
"terminal.integrated.fontFamily" = "CaskaydiaCove Nerd Font Mono"
"terminal.integrated.fontSize"   = 12

# Nerd Font families downloaded from:
#   https://github.com/ryanoasis/nerd-fonts/releases/latest/download/<zip>.zip
#
# zip    — filename stem of the release asset
# family — substring matched case-insensitively against `fc-list` output; used as the primary
#           installed check (works for both v2 and v3 regardless of filename format).
#           Can be a string or a list of strings (any match = installed).
# check  — file glob against ~/.local/share/fonts/; fallback when family is not set.
#           Written for v3 filenames; v2 files have spaces so they don't match.
#
# Nerd Fonts renames families that carry an OFL Reserved Font Name clause (RFN) —
# a patched font may not keep the upstream name:
#   CascadiaCode  → CaskaydiaCove  (Microsoft OFL RFN)
#   SourceCodePro → SauceCodePro   (Adobe OFL RFN)
#
# The fc-list family names (OpenType metadata) use compact no-space names even in v2:
#   file: "JetBrains Mono Regular Nerd Font Complete.ttf"
#   family: "JetBrainsMono Nerd Font"
# So the same `family` search term works across both v2 and v3.
#
# Each zip ships three variants per weight (v3+):
#   NerdFont      — default, double-width icons
#   NerdFontMono  — single-width icons, best for terminals
#   NerdFontPropo — proportional-width icons, best for GUI editors
#
# check  — v3 file glob; if any file matches, the family is considered up-to-date (no download).
#           v3 uses compact no-space filenames (e.g. JetBrainsMonoNerdFont-Regular.ttf).
# legacy — v2 file globs to remove before installing v3; safe to run repeatedly (missing_ok).
#           v2 used spaced filenames (e.g. "JetBrains Mono Regular Nerd Font Complete.ttf").
[[settings.fonts.families]]
zip    = "CascadiaCode"
family = "CaskaydiaCove Nerd Font"
check  = "CaskaydiaCove*NerdFont*.ttf"
legacy = ["Caskaydia Cove*Nerd Font Complete.ttf"]

[[settings.fonts.families]]
zip    = "JetBrainsMono"
family = "JetBrainsMono Nerd Font"
check  = "JetBrainsMono*NerdFont*.ttf"
legacy = ["JetBrains Mono*Nerd Font Complete.ttf"]

[[settings.fonts.families]]
zip    = "SourceCodePro"
family = "SauceCodePro Nerd Font"
check  = "SauceCodePro*NerdFont*.ttf"
legacy = ["Sauce Code Pro*Nerd Font Complete.ttf", "SourceCodePro-*.otf"]

[[settings.fonts.families]]
zip    = "Meslo"
family = "MesloLG"          # prefix shared by MesloLGS, MesloLGL, MesloLGM and DZ variants
check  = "MesloLG*NerdFont*.ttf"
legacy = ["Meslo LG*Nerd Font Complete.ttf"]

[[settings.fonts.families]]
zip    = "RobotoMono"
family = "RobotoMono Nerd Font"
check  = "RobotoMono*NerdFont*.ttf"
legacy = ["Roboto Mono*Nerd Font Complete.ttf"]

[[settings.fonts.families]]
zip    = "FiraCode"
family = ["FiraCode Nerd Font", "FuraCode Nerd Font"]   # v3 name; v2 renamed due to OFL RFN
check  = "FiraCode*NerdFont*.ttf"
legacy = ["Fura Code*Nerd Font Complete.ttf"]

[[settings.fonts.families]]
zip    = "FiraMono"
family = ["FiraMono Nerd Font", "FuraMono Nerd Font"]   # v3 name; v2 renamed due to OFL RFN
check  = "FiraMonoNerdFont*.otf"                        # v3 FiraMono ships .otf, not .ttf
legacy = ["Fura Mono*Nerd Font Complete.ttf"]

[[settings.fonts.families]]
zip    = "Ubuntu"
family = "Ubuntu Nerd Font"     # distinguishes from the system "Ubuntu" font family
check  = "UbuntuNerdFont-*.ttf"
legacy = ["Ubuntu*Nerd Font Complete.ttf"]

[[settings.fonts.families]]
zip    = "UbuntuMono"
family = "UbuntuMono Nerd Font"
check  = "UbuntuMonoNerdFont-*.ttf"
legacy = ["Ubuntu Mono*Nerd Font Complete.ttf"]

[packages.software-properties-common]
description = "Provides add-apt-repository — prerequisite for all apt-repo setup tasks in this config"
method      = "apt"
tags        = ["apt", "setup"]

[packages.lm-sensors]
description = "Read hardware temperature, voltage, and fan speeds via lm-sensors and sensors command"
method      = "apt"
tags        = ["hardware", "monitor", "workstation"]

[packages.patchelf]
description = "Modify ELF binaries — required by Nuitka to patch compiled executables"
method      = "apt"
tags        = ["build", "dev"]

[packages.build-tools]
description = "C/C++ build toolchain and POSIX developer man pages"
method      = "apt"
tags        = ["build", "dev"]
packages    = [
    "make", "build-essential", "gettext", "pkg-config", "cmake",
    # man-db itself is a 24.04 default; the dev and POSIX pages are not
    "manpages-dev", "manpages-posix-dev",
]

[packages.git]
description = "Distributed version control system"
method      = "apt"
tags        = ["dev", "vcs"]

[packages.vim]
description = "Full Vim editor (vim-tiny is the 24.04 default; this installs the complete version)"
method      = "apt"
tags        = ["editor", "cli"]

[packages.curl]
description = "Command-line tool for transferring data with URLs — HTTP, FTP, and more. wget is also available without installing (ubuntu-standard default) for simple downloads."
method      = "apt"
tags        = ["network", "cli"]

[packages.ssh]
description = "SSH client, GPG, and keychain agent manager — keys and secure connections"
method      = "apt"
tags        = ["security", "dev"]
packages    = ["openssh-client", "gnupg", "keychain"]

[packages.openssh-server]
description = """
SSH daemon — makes this machine reachable via SSH from other devices.
Enable if you need remote access (e.g. from a laptop, or for remote dev via VS Code/JetBrains).
The client is always installed via [packages.ssh]; this only adds the server side.
"""
method      = "apt"
enabled     = false
tags        = ["security", "network"]

[packages.network-diag]
description = """
Network diagnostics and monitoring suite.
  nmap         — port scanner and host discovery
  traceroute   — hop-by-hop path analysis to a host
  iftop        — real-time bandwidth usage per connection
  hping3       — packet crafting, TCP/IP testing, ping with more control
  vnstat       — persistent historical bandwidth stats per interface
  iptraf-ng    — ncurses IP traffic monitor
  dool         — real-time system resource stats (successor to dstat)
  iproute2-doc — man pages for ip, ss, tc (iproute2 itself is a 24.04 default)
Useful for network troubleshooting and monitoring; overkill for general dev.
"""
method      = "apt"
enabled     = false
tags        = ["network", "monitor"]
packages    = ["nmap", "traceroute", "iftop", "hping3", "vnstat", "iptraf-ng", "dool", "iproute2-doc"]

[packages.network-dev]
description = """
C development libraries for low-level network programming.
  libpcap-dev  — packet capture API (used by tcpdump, Wireshark, etc.)
  libnet1-dev  — raw packet construction and injection
Enable only if writing C/C++ tools that interact directly with network packets.
"""
method      = "apt"
enabled     = false
tags        = ["network", "dev", "build"]
packages    = ["libpcap-dev", "libnet1-dev"]

[packages.net-tools]
description = """
Legacy networking utilities, superseded by iproute2 in all modern distros.
  ifconfig → ip addr   |   netstat → ss   |   route → ip route   |   arp → ip neigh
Ubuntu 24.04 recommends iproute2 instead. Enable only if scripts or muscle memory
require the old command names.
"""
method      = "apt"
enabled     = false
tags        = ["network", "legacy"]

[packages.network-fs]
description = """
Packages for mounting remote filesystems over the network.
  cifs-utils — mount Windows SMB/CIFS shares (NAS devices, Windows file servers)
  rpcbind    — RPC portmapper daemon, required for NFS mounts
Enable if you access network file shares; both are dead weight otherwise.
"""
method      = "apt"
enabled     = false
tags        = ["network", "files"]
packages    = ["cifs-utils", "rpcbind"]

[packages.clipboard]
description = "Wayland clipboard CLI — wl-copy and wl-paste for scripts and terminal tools"
method      = "apt"
tags        = ["cli", "desktop", "gui"]
packages    = ["wl-clipboard"]
zshrc       = """
alias xcc="wl-copy"
function xc() { echo -n "$*" | wl-copy; }
alias xv="wl-paste"
"""

# Required for any portal-based screenshot/screencast tool (e.g. flameshot below): apps capture
# via the standard org.freedesktop.portal.Screenshot D-Bus interface, which has no backend
# implementation without this package — the request just hangs forever with no error (confirmed
# via busctl monitor 2026-08-08). GNOME's own built-in tool and gnome-screenshot are unaffected
# since they call org.gnome.Shell.Screenshot directly, bypassing the portal entirely.
[packages.xdg-desktop-portal-gnome]
description = "GNOME backend for the xdg-desktop-portal Screenshot/ScreenCast D-Bus interfaces"
method      = "apt"
enabled     = true
tags        = ["desktop"]

# See docs/screen_capture.md for shortcut design and comparison with the built-in GNOME screenshot
# tool. After install, run `inv screenshot.enable` to wire up shortcuts (see docs for details).
# Installed from GitHub releases, not apt: Ubuntu noble-updates only has v12.1.0, which hangs
# indefinitely on capture on this GNOME 46/Wayland setup (confirmed via gdb+busctl 2026-08-08 —
# the portal *does* return a valid result, but v12.1.0's own Qt/D-Bus signal handling never
# processes it). v14.0.0 ships a matching Ubuntu 24.04 build; pinned rather than tracking
# `latest` since the asset filename embeds a git-describe string, not the release version — bump
# `tag`/`asset` by hand when a newer release is worth trying.
[packages.flameshot]
description = "Screenshot tool with built-in annotation editor — arrows, text, blur, crop. Better than the GNOME built-in when you need to mark up screenshots for docs or bug reports."
method       = "deb-github"
repo         = "flameshot-org/flameshot"
tag          = "v14.0.0"
tag_prefix   = ""
asset        = "flameshot-v14.0+git0.da6121bd-artifact-ubuntu-24.04-amd64.zip"
check_cmd    = "flameshot"
enabled      = true
tags         = ["desktop", "gui"]

[packages.shellcheck]
description = "Static analysis and linting for shell scripts"
method      = "apt"
tags        = ["dev", "linting"]

[packages.dos2unix]
description = "Convert CRLF line endings to LF — useful when receiving files from Windows"
method      = "apt"
tags        = ["cli", "files"]

[packages.rsync]
description = """
Fast incremental file transfer — already installed as an ubuntu-standard default.
Listed here for awareness: useful for local backups, deploy scripts, and syncing
directories between machines. No install needed on a standard Ubuntu 24.04 desktop.
"""
method      = "apt"
enabled     = false
tags        = ["files", "network", "cli"]

[packages.font-manager]
description = "GUI for browsing, previewing, and toggling installed font families — useful alongside Nerd Fonts"
method      = "apt"
tags        = ["fonts", "desktop", "gui"]

[packages.gnome-system-monitor-ext]
description = """
GObject introspection libraries required by the GNOME system-monitor shell extension.
  gir1.2-gtop-2.0 — system resource data (CPU, memory, disk)
  gir1.2-nm-1.0   — NetworkManager data (network interface stats)
Disable if not running the system-monitor GNOME extension.
"""
method      = "apt"
enabled     = false
tags        = ["gnome", "monitor", "gui"]
packages    = ["gir1.2-gtop-2.0", "gir1.2-nm-1.0"]

[packages.gnome-clocks]
description = "GNOME Clocks — world clock, stopwatch, timer, and alarms; desktop convenience, not dev-related"
method      = "apt"
enabled     = false
tags        = ["gnome", "desktop", "gui"]

[packages.gnome-browser-connector]
description = "Native messaging host that bridges the GNOME Shell Integration browser extension to gnome-shell. Required for installing extensions via browser; not needed if using gext CLI."
method      = "apt"
enabled     = false
tags        = ["gnome", "desktop", "gui"]

[packages.gnome-extensions-cli]
description = "gext — CLI tool for installing, enabling, and updating GNOME Shell extensions from extensions.gnome.org. Powers inv gnome.extensions."
method      = "uv-tool"
package     = "gnome-extensions-cli"
check_cmd   = "gext"
tags        = ["gnome", "desktop", "gui"]

# ---------------------------------------------------------------------------
# GNOME Shell extensions — installed and enabled via: inv gnome.extensions
# Each entry uses method = "gnome-extension". Set enabled = true to include.
# Use uuid (the string identifier) or ego_id (numeric EGO package number) —
# uuid is preferred; ego_id is a fallback when the UUID still needs confirming.
# ---------------------------------------------------------------------------

[packages.gnome-ext-dash-to-panel]
description = "Dash to Panel — merges the top bar and dock into a single taskbar; Windows-style workflow with app icons, clock, and system tray in one strip"
method      = "gnome-extension"
enabled     = true
tags        = ["gnome", "desktop", "gui"]
uuid        = "dash-to-panel@jderose9.github.com"

[packages.gnome-ext-dash-to-panel.dconf]
"/org/gnome/shell/extensions/dash-to-panel/panel-size" = "28"
"/org/gnome/shell/extensions/dash-to-panel/show-favorites" = "true"
# panel-element-positions (clock centering, panel layout) contains the monitor serial ID
# and is not portable — configure it via the prefs dialog on each new machine

[packages.gnome-ext-extension-list]
description = "Extension List — manage and toggle installed GNOME extensions from a top-bar dropdown without opening Settings"
method      = "gnome-extension"
enabled     = true
tags        = ["gnome", "desktop", "gui"]
uuid        = "extension-list@tu.berry"

[packages.gnome-ext-clipboard-indicator]
description = "Clipboard Indicator — clipboard history accessible from the top bar; keeps the last N entries for fast re-paste"
method      = "gnome-extension"
enabled     = true
tags        = ["gnome", "desktop", "gui"]
uuid        = "clipboard-indicator@tudmotu.com"

[packages.gnome-ext-gtile]
description = "gTile — keyboard-driven window tiling grid; press a hotkey, pick a grid slot, window snaps to it"
method      = "gnome-extension"
enabled     = false
tags        = ["gnome", "desktop", "gui"]
uuid        = "gTile@vibou"

[packages.gnome-ext-lockkeys]
description = "Lock Keys — shows CapsLock and NumLock state in the top bar so you always know what mode you're in"
method      = "gnome-extension"
enabled     = true
tags        = ["gnome", "desktop", "gui"]
uuid        = "lockkeys@vaina.lt"
# dconf: defaults are fine — style='both', always-on indicator for both locks

[packages.gnome-ext-switcher]
description = "Switcher — single hotkey opens a combined app launcher + window switcher; type to fuzzy-filter running windows or apps. Retired: original maintainer inactive, replaced by AATWS"
method      = "gnome-extension"
enabled     = false
tags        = ["gnome", "desktop", "gui"]
uuid        = "switcher@landau.fi"

[packages.gnome-ext-aatws]
description = "Advanced Alt-Tab Window Switcher — replaces Alt+Tab/Super+Tab with a searchable, filterable switcher; type to find running windows by title; actively maintained for GNOME 46–50"
method      = "gnome-extension"
enabled     = true
tags        = ["gnome", "desktop", "gui"]
uuid        = "advanced-alt-tab@G-dH.github.com"
ego_id      = 4412

[packages.gnome-ext-freon]
description = "Freon — superseded by Vitals (which covers temps, fans, voltage, storage and more); keep disabled"
method      = "gnome-extension"
enabled     = false
tags        = ["gnome", "desktop", "gui", "workstation"]
uuid        = "freon@UshakovVasilii_Github.yahoo.com"
ego_id      = 841

[packages.gnome-ext-tophat]
description = "Top Hat — CPU, memory, disk I/O, and network sparklines in the top bar; modern TypeScript codebase, no extra deps"
method      = "gnome-extension"
enabled     = true
tags        = ["gnome", "desktop", "gui"]
uuid        = "tophat@fflewddur.github.io"

[packages.gnome-ext-tophat.dconf]
# show-disk defaults to false; enable it for disk I/O throughput sparkline
"/org/gnome/shell/extensions/tophat/show-disk"        = "true"
# Pin root to the panel bar; hide /boot (small system partition, not useful for daily monitoring).
# Snap loop mounts don't appear because Ubuntu's df already excludes squashfs/loop devices.
"/org/gnome/shell/extensions/tophat/mount-to-monitor" = "'/'"
"/org/gnome/shell/extensions/tophat/fs-hide-in-menu"  = "'/boot'"
"/org/gnome/shell/extensions/tophat/refresh-rate"      = "'slow'"

[packages.gnome-ext-vitals]
description = "Vitals — hardware sensors: temps, fans, voltage, disk temps; show-processor/memory/network disabled (Top Hat handles usage metrics)"
method      = "gnome-extension"
enabled     = true
tags        = ["gnome", "desktop", "gui", "workstation"]
uuid        = "Vitals@CoreCoding.com"

