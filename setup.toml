[packages.fzf]
description = "Interactive fuzzy finder — Ctrl+R history, Ctrl+T file picker, Alt+C directory jump, ** tab completion. Uses fd for file listing and bat for previews."
method = "apt"
tags = ["search", "interactive"]
zshenv = """
# Use fd as the default source: respects .gitignore, includes hidden files, skips .git
export FZF_DEFAULT_COMMAND='fd --type f --hidden --follow --exclude .git'
export FZF_CTRL_T_COMMAND="${FZF_DEFAULT_COMMAND}"
export FZF_ALT_C_COMMAND='fd --type d --hidden --follow --exclude .git'
# Global UI defaults
export FZF_DEFAULT_OPTS='--height=40% --layout=reverse --border=rounded --info=inline'
# Ctrl+T: preview file contents with bat
export FZF_CTRL_T_OPTS="--preview 'bat -n --color=always --line-range :300 {}'"
# Alt+C: preview directory listing
export FZF_ALT_C_OPTS="--preview 'ls -la {}'"
# Ctrl+R: show full command in a toggleable preview (Ctrl+/ to toggle)
export FZF_CTRL_R_OPTS="--preview 'echo {}' --preview-window=up:3:hidden:wrap --bind 'ctrl-/:toggle-preview'"
"""
zshrc = """
[ -f /usr/share/doc/fzf/examples/key-bindings.zsh ] && source /usr/share/doc/fzf/examples/key-bindings.zsh
[ -f /usr/share/doc/fzf/examples/completion.zsh ] && source /usr/share/doc/fzf/examples/completion.zsh
"""

[packages.atuin]
description = "Shell history replacement — SQLite backend, rich search UI (exit code, directory, duration per command). No sync, no daemon. Disabled pending evaluation; fzf handles Ctrl+R for now."
