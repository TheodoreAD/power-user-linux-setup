# Registry of CLI tools tracked by `inv allowlist.*` (tasks/allowlist.py).
#
# Fields (all optional except the section name, which is the binary to invoke):
#   version_flag     args to get a version string, for cache-invalidation (default: "--version")
#   help_flag        args to get top-level help (default: "--help")
#   help_style       "prefix" = <tool> <help_flag> <sub> instead of the default <tool> <sub>
#                     <help_flag> — needed for tools whose <sub> --help is a stub pointing
#                     elsewhere (go: `go list --help` says "Run 'go help list' for details")
#   no_subcommands   true = flat tool (flags only, no subcommand tree) — capture top-level help
#                     only, classify it as a single unit (default: false)
#   subcommands      explicit list of subcommands to probe --help for, instead of
#                     auto-discovering them by parsing the top-level help text
#   skip_interactive true = don't run --help at all; this tool is only usable interactively
#                     (a TUI), so there's no non-interactive command surface to classify
#   max_subcommands  override the global auto-discovery breadth cap (default: 40)
#   shell_prefix     shell snippet to source before invoking the tool, for tools that only exist
#                     as a shell function (e.g. nvm) rather than a binary on PATH — extraction
#                     runs `bash -c "<shell_prefix> && <tool> <args>"` instead of exec-ing directly
#   max_depth        how many levels deep to recurse into subcommands (default: 1, i.e. today's
#                     behavior — tool -> direct subcommand only). 2 means also probe each
#                     subcommand's own --help for a further "Commands:" listing and capture those
#                     too (git remote add, docker network create, gh secret set, ...). Opt-in per
#                     tool, not global — most tools' real risk lives at depth 1 and don't need it.
#   max_nodes        total node budget for the whole recursive tree, breadth-first (default: 60).
#                     Only matters once max_depth > 1; caps runaway trees (docker/gh/git/kubectl
#                     need a higher override — see below) rather than growing unbounded.
#   cloud_cli        true = this tool's real command surface is too large to auto-discover
#                     exhaustively (gcloud/aws-style provider CLIs: thousands of leaf commands,
#                     3 levels deep by construction: <tool> <service> <resource> <verb>). Marks the
#                     tool as intentionally staying at max_depth=1 with a hand-picked top-level
#                     `subcommands` list, rather than looking like an oversight — recursion into
#                     these is a non-goal, not a gap to eventually close. Also caps every node of
#                     the tool at `ask` in `render`/`apply`, regardless of its own classification —
#                     a node here is necessarily a bare top-level service-group command (`gcloud
#                     storage`, `sql`, ...), classified on what running it with no args does, not
#                     on what its real (unrecursed, unmodeled) subcommands do. Confirmed as a real
#                     gap, not hypothetical: `gcloud storage`/`sql`/`secrets`/`run` all classified
#                     read_only this way despite having genuinely destructive subcommands
#                     (`storage rm -r`, `sql instances delete`, ...) with no narrower rule to catch
#                     them. See contributing/cli-allowlist.md's "render / apply" section.
#
# Tree discovery can surface a node that isn't actually a real command — a discovery regex
# matching a sample-output table row, a deprecated/plugin subcommand whose --help silently echoes
# its parent's — rather than a hand-maintained exclude list per tool, these get caught by a
# two-layer check (deterministic "lone duplicate of its parent" detection at extract time, plus an
# `invalid` classification tier the LLM can assign at classify time for weirdness that isn't a
# content duplicate at all) and excluded from render/apply automatically. Full writeup with the two
# real examples that drove this (`helm list maudlin-arachnid`, `helm diff`) is in
# contributing/cli-allowlist.md under "Recursive tree extraction".
#
# Three more things worth knowing before touching classify/render, all documented in full in
# contributing/cli-allowlist.md:
#   - `render` skips a read_only node that has children of its own (`docker network` when
#     `docker network rm`/`create`/... already exist) — see "render / apply".
#   - `classify` always re-sweeps any node with `source: "community"` back into fresh LLM
#     classification, content hash notwithstanding — community-seeded data is deliberately
#     self-liquidating now that the pipeline has its own mature rubric. See "Classification via
#     headless Claude".
#   - `inv allowlist.reconfirm` is a second-pass LLM call, separate from `classify`, that resolves
#     `needs_review` items (subcommands/flags the verb-token backstop overrode) by giving the model
#     the specific flagged word and trusting its verdict without re-running the same backstop on
#     it. See "reconfirm — resolving needs_review".
#
# Extraction runs with PAGER/MANPAGER/GIT_PAGER/BROWSER neutralized (see _DETERMINISTIC_ENV in
# tasks/allowlist.py) so captured text doesn't depend on this machine's interactive shell config
# or on optional packages like git-man being installed — confirmed empirically that git's default
# `--help` only worked here because git-man happens to be present; `-h` doesn't have that
# dependency and is used below for that reason, not merely as a style preference.
#
# Man-page-dependency audit: `inv allowlist.check-man-deps` runs every registered tool's help
# invocation under `strace -f -e trace=execve` and checks for a child exec of /usr/bin/man — the
# only reliable way to tell "renders like a man page" (gcloud, which mimics man's NAME/SYNOPSIS/
# DESCRIPTION layout with its own self-contained renderer) apart from "actually shells out to man"
# (git, the one real case as of 2026-08-10, already fixed above with `-h`). Re-run it before
# trusting a newly-added tool's default `--help` on a machine that might not have every optional
# doc package installed — as of 2026-08-10 it's clean (0 of 49 registered tools depend on man).
#
# Some tools (currently gh, kubectl, helm, docker, terraform, gcloud — git was seeded the same way
# but later reclassified via LLM after its help_flag changed) have depth-1 nodes with
# `source: "community"` in their cli-allowlist/rules/<tool>.json, seeded from
# github.com/UgurcanAkkok/claude-allow-list (MIT-style curated allowlist) rather than classified
# fresh. Since five of these six also now recurse to depth 2 (see below), their depth-1 nodes stay
# community-sourced while their new depth-2 nodes are freshly LLM-classified — source is tracked
# per node, not per tool, specifically for this mixed case. They all still go through
# `inv allowlist.review` like everything else.

[git]
help_flag = "-h" # not --help: that renders through `man`, which depends on git-man being installed
max_depth = 2 # real per-verb risk lives one level down: remote add/rm, stash pop/drop, worktree remove
max_nodes = 100
subcommands = [
  "status",
  "log",
  "diff",
  "show",
  "blame",
  "grep",
  "branch",
  "tag",
  "remote",
  "config",
  "stash",
  "submodule",
  "worktree",
  "notes",
  "bisect",
  "rev-parse",
  "ls-files",
  "ls-remote",
  "fsck",
  "commit",
  "add",
  "merge",
  "rebase",
  "checkout",
  "push",
  "pull",
  "clean",
  "reset",
]

[gh]
max_depth = 2 # pr create/merge, secret set/remove, release delete, etc. are the real distinctions
max_nodes = 200 # real tree measured ~170+ nodes at depth 2; 150 truncated it
subcommands = [
  "auth",
