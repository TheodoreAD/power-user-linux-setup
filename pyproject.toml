[project]
name = "power-user-linux-setup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "invoke",
  "pytest",
  "repo-tasks",
  "ruff",
  "shellcheck-py",
  "shfmt-py",
  "dprint-py",
  "invoke-stubs @ git+https://github.com/TheodoreAD/invoke-stubs",
  "actionlint-py",
  "act-bin",
  # `typing_extensions.override` for the test suite's Context subclass — `typing.override` is
  # 3.12+ and requires-python still says 3.11.
  "typing-extensions",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasks"]

[tool.uv.sources]
repo-tasks = { git = "https://github.com/TheodoreAD/repo-tasks" }
