[project]
name = "power-user-linux-setup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "invoke",
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasks"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# ruff 0.16 (2026-07) changed its own default from the narrow E4/E7/E9/F set (59 rules) to a much
# broader 413-rule default — extend-select would pile these on top of that new default and land
# near-ALL (~966 rules, including bandit/pylint/async-safety noise never intended here). Pin an
# explicit select instead: the old default (E4, E7, E9, F) plus this repo's curated additions.
select = [
  # old ruff default (pycodestyle subset + pyflakes)
  "E4",
  "E7",
  "E9",
  "F",
  "E501", # line too long — formatter doesn't wrap comments/docstrings/strings
  "I", # isort — import sorting
  "UP", # pyupgrade — modern syntax for the target version
  "B", # flake8-bugbear — common bug patterns
  "C4", # flake8-comprehensions
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "RET", # flake8-return
  "TID", # flake8-tidy-imports
  # added 2026-08-16 (plans/2026-08-14-python-repo-scaffolding.md §C2): ruff's own zero-config
  # default already includes RUF — an explicit `select` doesn't inherit it, so this repo was
  # silently missing it until now.
  "RUF", # ruff-specific rules (mutable class defaults, noqa hygiene, f-string pitfalls, ...)
  "C90", # mccabe complexity — default threshold 10; 15 pre-existing @task handlers noqa'd, not
  # refactored in this pass (see `rg "noqa: C901"`)
  "PERF", # perflint — real inefficiencies, low false-positive rate
  "A", # flake8-builtins — shadowed builtins; a few deliberate invoke CLI names noqa'd (dir/all
  # are also the actual --flag/subcommand names, changing them would break the CLI)
  "DTZ", # flake8-datetimez — naive datetime.now()/utcnow(), a real timezone-bug class
  "PL", # pylint subset — PLR (refactor-suggestion codes: too-many-args/branches/statements,
  # magic-value-comparison) dropped below; every real-world config checked during research (Home
  # Assistant, Litestar) carves it out the same way, and this repo's own hits confirmed why
  # (PLR0912/0913/0915/0911/2004/0917 all fired on ordinary, not-actually-complex code)
  "TRY", # tryceratops — exception-handling anti-patterns; TRY003 dropped below
]
ignore = [
  "PLR", # see PL comment above — refactor-suggestion noise, not bug-catching
  "TRY003", # "raise vanilla exception with a long message" — this repo deliberately keeps a
  # minimal exception hierarchy (plans/2026-08-15-python-conventions.md §3); Home Assistant's own
  # config drops this same code for being too opinionated for exactly this reason
]

[tool.ruff.lint.isort]
known-first-party = ["tasks"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.basedpyright]
# "recommended", not "strict" — strict mode leaves basedpyright's own exclusive bug-catching rules
# (reportAny, reportUnreachable, ...) at "none"/"hint", since they were wired into recommended/all
# for pyright/VS-Code backward compatibility rather than retrofitted into the older strict ladder.
# See plans/2026-08-14-python-repo-scaffolding.md §C1 for the full research trail behind this profile.
typeCheckingMode = "recommended"

# reference/allowlists/repos/** holds upstream repos cloned verbatim for research (see
# feedback_research_via_cloned_repos memory) — not this project's own code, never type-check it.
# skills/*/references/snippets/** are standalone example files, each with its own "pip install X"
# docstring — deliberately not installed as this repo's own deps (same reason pytest's own
# testpaths excludes them from this repo's test run) — they get typed-and-checked in whatever
# future project actually installs and runs them, not here.
# Setting `exclude` explicitly replaces basedpyright's own default list rather than adding to it —
# the defaults below (node_modules/__pycache__/dot-dirs, which is how .venv normally gets skipped)
# must be repeated here or third-party packages inside .venv get type-checked too.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "reference", "skills/*/references/snippets"]

# recommended defaults failOnWarnings=true, which makes "warning" behave like "error" for a
# CLI-driven check. Turning it off restores warning/error as an actual blocking-vs-visible split:
# rules left at "warning" below are ceremony that shouldn't have to be fixed for a green run, but
# still show up in an editor or on review.
failOnWarnings = false

# escalate: real bugs "recommended" only grades as warning, or that basedpyright's own exclusive
# rules leave off entirely under "strict".
reportAny = "error" # Any silently laundered through instead of a real fix
reportUnreachable = "error" # dead branch from a logic error; "hint" even under strict, CLI-invisible
reportIgnoreCommentWithoutRule = "error" # blanket ignore can mask an unrelated future error on the same line
reportUnnecessaryTypeIgnoreComment = "error" # stale suppression left after the real fix landed
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnusedFunction = "error"
reportUnusedClass = "error" # unused code = likely leftover from a half-finished edit
reportUnusedCoroutine = "error" # forgotten `await`; recommended oddly downgrades this from basic's error
reportUnnecessaryIsInstance = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error" # always-true/false check = wrong assumption from a bad refactor
reportMatchNotExhaustive = "error" # missing match case
reportRedeclaration = "error" # same symbol, two incompatible types = probably duplicated code
reportPropertyTypeMismatch = "error" # subtly-wrong getter/setter type

# downgrade: strict-mode ceremony that recommended doesn't already soften
reportMissingTypeArgument = "warning" # bare generics; not worth a turn parametrizing every list/dict use

# downgrade: pilot run against this repo's real code (2026-08-16) found this rule can't distinguish
# a forgotten comma from this codebase's routine, deliberate style of wrapping one long string
# across several parenthesized literals (print/log messages, setup.toml-style descriptions) — every
# hit found here was the latter. A per-pattern rule that can't tell the two apart isn't worth even
# a warning at this codebase's actual false-positive rate; ruff's own ISC001 has the identical
# conflict with the formatter's string-wrapping and is disabled for the same reason.
reportImplicitStringConcatenation = "none"

# left at recommended's default "warning" (non-blocking now that failOnWarnings=false): the
# annotation-completeness / untyped-third-party-dependency cluster — reportMissingParameterType,
# reportUnknown{Parameter,Argument,Variable,Member}Type, reportMissingTypeStubs,
# reportUntyped{FunctionDecorator,ClassDecorator,BaseClass,NamedTuple},
# reportUnannotatedClassAttribute, reportCallInDefaultInitializer, reportUnusedCallResult,
# reportUnusedParameter, reportPrivateUsage — no override needed.

# fill in per untyped dependency as encountered, instead of a global severity change.
# invoke ships no type stubs — every `c: Context` task parameter and the Task object's own
# attributes (e.g. `.body`, the undecorated function invoke's @task wraps — see tests/test_ai.py's
# `ai.skills.body(...)` calls) are Unknown/Any without this. This is the single largest source of
# warning volume in this repo; it's real friction from an untyped dependency, not a code smell.
allowedUntypedLibraries = ["invoke"]

# downgrade: pilot run found this fires on tasks/__init__.py's own necessary shape — it imports
# every task submodule to build an invoke Collection, and each submodule does `from . import
# util` (a sibling import through the package). Python resolves this fine at runtime (submodule
# imports don't require the package's own __init__ body to have finished first) — a real,
# standard invoke-package pattern, not a bug. Downgraded rather than silenced entirely since a
# *genuine* cycle elsewhere would still be worth seeing.
reportImportCycles = "warning"

# NOTE: every [tool.basedpyright] key must come above this point — TOML scopes bare `key = value`
# lines to the most recently opened table, so anything placed after the [[executionEnvironments]]
# array-of-tables below would silently apply to that array entry instead of the top-level config
# (caught during this same pilot run: reportImportCycles above landed inside executionEnvironments
# on the first attempt and silently did nothing at the top level).

# pytest autouse fixtures (def _reset_dry_run(): ..., @pytest.fixture(autouse=True)) are called
# only by pytest's own plugin machinery, never referenced by name anywhere in the file — a
# structural false positive for reportUnusedFunction that will recur in every test file that uses
# one, so it's scoped off for tests/ rather than ignored per-fixture.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnusedFunction = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
