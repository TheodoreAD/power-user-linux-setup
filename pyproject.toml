[project]
name = "power-user-linux-setup"
version = "0.1.0"
requires-python = ">=3.11"
# `invoke` is a real dependency, not a dev one: `spowse` is installed with `uv tool install`, whose
# environment resolves `dependencies` and nothing else, and `tasks/cli.py` imports invoke at module
# scope. In the dev group it resolved fine for `inv` in the checkout and left the shim unable to
# start. Nothing else changes — bootstrap.sh's zero-install path installs invoke as its own uv tool
# and never runs `uv sync`, and CI's sync already pulled it in through the group.
dependencies = ["invoke"]

# Sensible POWer-user SEtup. `spouse` is the same entry point under the spelling fingers reach for
# first — the joke is a homophone, so the typo is guaranteed rather than hypothetical, and a second
# console script costs one line against a `command not found` every time it happens.
[project.scripts]
spowse = "tasks.cli:main"
spouse = "tasks.cli:main"

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "pytest",
  "repo-tasks",
  "ruff",
  "shellcheck-py",
  "shfmt-py",
  "dprint-py",
  "invoke-stubs @ git+https://github.com/TheodoreAD/invoke-stubs",
  "actionlint-py",
  "act-bin",
  # `typing_extensions.override` for the test suite's Context subclass — `typing.override` is
  # 3.12+ and requires-python still says 3.11.
  "typing-extensions",
  "pytest-cov",
  "zizmor",
  "hadolint-py",
  "pytest-socket",
  "pytest-timeout",
]
# The docs-site engine, pinned, in the group repo_tasks' docs.py already assumes
# (`uv sync --group docs`). It used to live in a requirements-docs.txt that only CI's Pages
# workflow read, while `inv docs.build` locally picked up setup.toml's unpinned machine-wide
# `uv tool` install — two declarations that drifted apart and shipped a red deploy (a `[certs]`
# table cell passed on a local 0.0.57 and failed CI's 0.0.44 with `unresolved link reference`,
# 2026-09-02). One pin, resolved from .venv/bin, which direnv puts ahead of ~/.local/bin.
docs = ["zensical==0.0.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasks"]

[tool.uv]
# `docs` is a default group, not an opt-in one: `inv dev-env.setup` (and CI's ci-bootstrap.sh,
# which is just `uv run inv dev-env.setup`) is the only thing that populates the venv, so a group
# it skips is a group `inv docs.build` cannot use — here or on a runner.
default-groups = ["dev", "docs"]

[tool.uv.sources]
repo-tasks = { git = "https://github.com/TheodoreAD/repo-tasks" }
